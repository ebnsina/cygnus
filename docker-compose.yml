services:
  postgres:
    image: postgres:17-alpine
    container_name: cygnus-postgres
    environment:
      POSTGRES_USER: cygnus
      POSTGRES_PASSWORD: cygnus
      POSTGRES_DB: cygnus
    ports:
      # 5433 on the host, to avoid colliding with a local PostgreSQL on 5432.
      - "5433:5432"
    command:
      # Tuned for benchmarking on a developer machine, not for production.
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - synchronous_commit=off
      # Surface slow queries during benchmark runs.
      - -c
      - log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cygnus -d cygnus"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - cygnus-pgdata:/var/lib/postgresql/data

volumes:
  cygnus-pgdata:
